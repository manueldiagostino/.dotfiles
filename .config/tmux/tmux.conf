# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# Change the command prefix from Ctrl-b to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set-option -gw xterm-keys on
set-option -g default-terminal "xterm-256color"
set -as terminal-features ',ghostty:extkeys'
set -as terminal-overrides ',ghostty:keys'

set -g mouse on

set-window-option -g mode-keys vi
set -s extended-keys on
set -g extended-keys-format csi-u

bind-key "s" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.1.3'

set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha
set -g @plugin 'tmux-plugins/tmux-yank'

# Stay in copy mode after copying (default is copy-pipe-and-cancel)
set -g @yank_action 'copy-pipe'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

#split panes using | and -
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Enter 'window-mgmt' mode with Prefix + w
bind -n M-w switch-client -T window-mgmt

bind -T window-mgmt n { new-window }
bind -T window-mgmt d { kill-window }

# Simple navigation (H / L)
bind -T window-mgmt h { previous-window; switch-client -T window-mgmt }
bind -T window-mgmt l { next-window; switch-client -T window-mgmt }

# Window swapping (Ctrl+h / Ctrl+l)
bind -T window-mgmt C-h { swap-window -t -1; previous-window; switch-client -T window-mgmt }
bind -T window-mgmt C-l { swap-window -t +1; next-window; switch-client -T window-mgmt }

# Keep standard Shift+Arrows for quick use without prefix
bind -n S-Left { previous-window }
bind -n S-Right { next-window }
bind -n C-S-Left { swap-window -t -1; previous-window }
bind -n C-S-Right { swap-window -t +1; next-window }

# Vertical Join
bind -T window-mgmt v run-shell "bash $XDG_CONFIG_HOME/tmux/scripts/join-fzf.sh -v"

# Horizontal Join
bind -T window-mgmt s run-shell "bash $XDG_CONFIG_HOME/tmux/scripts/join-fzf.sh -h"

bind -T window-mgmt u { 
    break-pane
    switch-client -T window-mgmt 
}

unbind '"'
unbind %

bind -nr C-J resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

set -g @catppuccin_status_modules_right "directory session date_time"
# Background and foreground integrated with Mocha palette
set -g status-left "#{?#{==:#{client_key_table},window-mgmt},#[fg=#181825#,bg=#f38ba8#,bold] MGMT #[default],}"

# Stay in copy mode after copying (override tmux-yank's copy-pipe-and-cancel)
bind-key -T copy-mode-vi Enter send-keys -X copy-selection
bind-key -T copy-mode Enter send-keys -X copy-selection
